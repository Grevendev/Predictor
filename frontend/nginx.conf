server {
    listen 80;
    server_name localhost;

    # Tvinga trailing slash på /predictor
    location = /predictor {
        return 301 $scheme://$http_host/predictor/;
    }

    # Statiska filer för React-applikationen
    location /predictor/ {
        alias /usr/share/nginx/html/predictor/;
        index index.html;
        try_files $uri $uri/ /predictor/index.html;
    }

    # Redirect från ren rot
    location = / {
        return 301 /predictor/;
    }
}