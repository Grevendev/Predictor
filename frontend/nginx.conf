server {
    listen 80;
    server_name localhost;

    # Tvinga trailing slash på /predictor
    location = /predictor {
        return 301 $scheme://$http_host/predictor/;
    }

    # Statiska filer för React-applikationen
    location /predictor/ {
        alias /usr/share/nginx/html/predictor/;
        index index.html;
        try_files $uri $uri/ /predictor/index.html;
    }

    # Vidarebefordra API-anrop till backend-containern
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect från ren rot
    location = / {
        return 301 /predictor/;
    }
}