server {
    listen 80;
    server_name localhost;

    # Tvinga trailing slash på /predictor så att relativa assets hittas rätt
    location = /predictor {
        return 301 $scheme://$http_host/predictor/;
    }

    # Reverse proxy för API-anrop vidare till FastAPI-containern
    location /predictor/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statiska filer för React-applikationen
    location /predictor/ {
        alias /usr/share/nginx/html/predictor/;
        index index.html;
        try_files $uri $uri/ /predictor/index.html;
    }

    # Redirect från ren rot till subpathen
    location = / {
        return 301 /predictor/;
    }
}