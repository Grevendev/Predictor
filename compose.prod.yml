services:
  # ---------------------------------------------------------------------------
  # BACKEND (FastAPI API)
  # Anrop mot: https://jarllindquist.com/predictor/api/...
  # ---------------------------------------------------------------------------
  backend:
    image: ${DOCKER_USERNAME}/predictor-backend:latest
    container_name: predictor_api_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - FASTAPI_ENV=production
      - PYTHONPATH=/app
      - ENABLE_METRICS=true
    volumes:
      - ./models_bin:/models_bin:ro
      - ./dataset:/app/dataset
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.predictor-api.rule=Host(`jarllindquist.com`) && PathPrefix(`/predictor/api`)"
      - "traefik.http.routers.predictor-api.entrypoints=websecure"
      - "traefik.http.routers.predictor-api.tls.certresolver=myresolver"
      - "traefik.http.routers.predictor-api.priority=1001" # Högre prioritet än frontend

      # Strippa /predictor så FastAPI tar emot /api/...
      - "traefik.http.routers.predictor-api.middlewares=predictor-api-strip"
      - "traefik.http.middlewares.predictor-api-strip.stripprefix.prefixes=/predictor"

      - "traefik.http.services.predictor-api.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # DATA SCHEDULER
  # ---------------------------------------------------------------------------
  data-scheduler:
    image: ${DOCKER_USERNAME}/predictor-backend:latest
    container_name: predictor_scheduler_prod
    restart: unless-stopped
    command: python scripts/get_last_date.py
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./dataset:/app/dataset
    networks:
      - internal-net

  # ---------------------------------------------------------------------------
  # FRONTEND (React / Nginx)
  # Anrop mot: https://jarllindquist.com/predictor
  # ---------------------------------------------------------------------------
  frontend:
    image: ${DOCKER_USERNAME}/predictor-frontend:latest
    container_name: predictor_ui_prod
    restart: always
    depends_on:
      - backend
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.predictor-ui.rule=Host(`jarllindquist.com`) && PathPrefix(`/predictor`)"
      - "traefik.http.routers.predictor-ui.entrypoints=websecure"
      - "traefik.http.routers.predictor-ui.tls.certresolver=myresolver"
      - "traefik.http.routers.predictor-ui.priority=1000"
      # Inga stripprefix-middlewares här! Nginx vill ha /predictor/
      - "traefik.http.services.predictor-ui.loadbalancer.server.port=80"

volumes:
  shared-data:
    driver: local

networks:
  internal-net:
    driver: bridge
  traefik-net:
    external: true
