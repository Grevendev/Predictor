services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictor_api_prod
    restart: always
    environment:
      - FASTAPI_ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./models_bin:/models_bin:ro
      - shared-data:/app/dataset # Monterad så API:et läser samma data
    networks:
      - internal-net

  data-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictor-scheduler
    restart: unless-stopped
    command: python app/scheduler_sync.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - shared-data:/app/dataset # Delad volym dit schedulern skriver
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BASE_PATH=/predictor/
    container_name: predictor_ui_prod
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # --- HTTP Router (Redirect till HTTPS) ---
      - "traefik.http.routers.predictor-http.rule=Host(`din-doman.se`) && PathPrefix(`/predictor`)"
      - "traefik.http.routers.predictor-http.entrypoints=web"
      - "traefik.http.routers.predictor-http.middlewares=redirect-to-https"

      # --- HTTPS Router ---
      - "traefik.http.routers.predictor-https.rule=Host(`din-doman.se`) && PathPrefix(`/predictor`)"
      - "traefik.http.routers.predictor-https.entrypoints=websecure"
      - "traefik.http.routers.predictor-https.tls=true"
      - "traefik.http.routers.predictor-https.tls.certresolver=letsencrypt"

      # --- Koppling till Nginx inuti containern ---
      - "traefik.http.services.predictor.loadbalancer.server.port=80"
    depends_on:
      - backend
    networks:
      - internal-net
      - traefik-net

networks:
  internal-net:
    driver: bridge
  traefik-net:
    external: true

volumes:
  shared-data:
    driver: local
