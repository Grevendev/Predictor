services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictor_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_ENV=development
      - PYTHONPATH=/app
    volumes:
      - ./backend/app:/app/app:ro
      - ./models_bin:/models_bin:ro
      - ./dataset:/app/dataset
    networks:
      - predictor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predictor_ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Här pekar vi på containern/servicen "backend" i Dockers interna DNS
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      # Mounta frontend-koden för HMR (Hot Module Replacement)
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Skydda containerns node_modules från att skrivas över av hostens
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - predictor-net

networks:
  predictor-net:
    driver: bridge
