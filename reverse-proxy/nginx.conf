server {
    listen 80;
    server_name ${DOMAIN};

    # Standard proxy-headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API: Strippa /predictor så anropet landar på /api/...
    location /predictor/api/ {
        proxy_pass http://predictor_api_prod:8000/api/;
    }

    # Frontend SPA
    location /predictor/ {
        proxy_pass http://predictor_ui_prod:80;
    }
}