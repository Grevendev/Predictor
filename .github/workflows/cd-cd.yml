name: CI/CD Pipeline

on:
  push:
    branches: ["deploy"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST OCH KVALITETSKONTROLL (CI)
  # ---------------------------------------------------------------------------

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests || echo "Inga tester hittades ännu"

  test-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check and build
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: /predictor/
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. BYGG OCH PUSHA TILL DOCKER HUB
  # ---------------------------------------------------------------------------

  build-and-push:
    name: Build & Push Images to Docker Hub
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # Krävs för att dra ned faktiska modellfiler och inte bara pointer-filer

      # Generera en tidsstämpel (ÅÅÅÅMMDD-TTMM) och kort SHA
      - name: Generate timestamp and short sha
        id: meta
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Hämta Docker Hub-inloggningen från Vault
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      # Logga in mot Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Konfigurera Docker Buildx för snabbare byggen och lager-caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bygg och pusha backend
      - name: Build & Push backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-backend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bygg och pusha frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. DEPLOY TILL VPS
  # ---------------------------------------------------------------------------

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy'
    steps:
      # Nödvändigt så att löparen har compose.prod.yml innan den scp:as över
      - name: Check out repository
        uses: actions/checkout@v4

      # Hämta hemligheter från Vault
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD ;
            kv/data/server-deploy ENTSOE_API_KEY | ENTSOE_API_KEY

      # Kopiera över uppdaterad compose-fil till VPS
      - name: Copy compose.prod.yml to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          port: ${{ env.SERVER_PORT || 22 }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          source: "compose.prod.yml"
          target: "/home/repos/predictor"

      # Kör utrullning på VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        env:
          ENTSOE_API_KEY: ${{ env.ENTSOE_API_KEY }}
          FASTAPI_ENV: "production"
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ env.DOCKER_PASSWORD }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          port: ${{ env.SERVER_PORT || 22 }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          envs: ENTSOE_API_KEY,FASTAPI_ENV,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            cd /home/repos/predictor

            mkdir -p backend
            echo "ENTSOE_API_KEY=${ENTSOE_API_KEY}" > backend/.env
            echo "FASTAPI_ENV=${FASTAPI_ENV}" >> backend/.env
            echo "PYTHONPATH=/app" >> backend/.env
            echo "ENABLE_METRICS=true" >> backend/.env

            # Rot-env för compose / Docker Hub
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}" > .env

            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --force-recreate
            docker image prune -f
