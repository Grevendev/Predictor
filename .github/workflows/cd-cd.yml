name: CI/CD Pipeline

on:
  push:
    branches: ["main", "deploy"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST OCH KVALITETSKONTROLL (Körs ALLTID, både på PR och Push)
  # ---------------------------------------------------------------------------

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests || echo "Inga tester hittades ännu"

  test-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check and build
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: /predictor/
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. BYGG OCH PUSHA TILL DOCKER HUB (Körs ENDAST vid push/merge till gren)
  # ---------------------------------------------------------------------------

  build-and-push:
    name: Build & Push Images to Docker Hub
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate timestamp and short sha
        id: meta
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-backend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. DEPLOY TILL VPS (Körs ENDAST efter lyckat bygge vid push/merge)
  # ---------------------------------------------------------------------------

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD ;
            kv/data/server-deploy ENTSOE_API_KEY | ENTSOE_API_KEY

      # Kopiera över compose-basfil och hela reverse-proxy-mappen
      - name: Copy Compose and Proxy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          port: ${{ env.SERVER_PORT || 22 }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          source: "compose.prod.yml,reverse-proxy/**"
          target: "/home/repos/predictor"
          overwrite: true

      # Kör utrullning på VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        env:
          ENTSOE_API_KEY: ${{ env.ENTSOE_API_KEY }}
          FASTAPI_ENV: "production"
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ env.DOCKER_PASSWORD }}
          DOMAIN: "jarllindquist.com"
          CERT_RESOLVER: "myresolver"
          PROXY_NETWORK: "traefik-net"
          PROXY_TYPE: ${{ vars.REVERSE_PROXY_TYPE || 'traefik' }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          port: ${{ env.SERVER_PORT || 22 }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          envs: ENTSOE_API_KEY,FASTAPI_ENV,DOCKER_USERNAME,DOCKER_PASSWORD,DOMAIN,CERT_RESOLVER,PROXY_NETWORK,PROXY_TYPE
          script: |
            cd /home/repos/predictor

            mkdir -p backend
            echo "ENTSOE_API_KEY=${ENTSOE_API_KEY}" > backend/.env
            echo "FASTAPI_ENV=${FASTAPI_ENV}" >> backend/.env
            echo "PYTHONPATH=/app" >> backend/.env
            echo "ENABLE_METRICS=true" >> backend/.env
            echo "ROOT_PATH=/predictor/api" >> backend/.env  

            cat <<EOF > .env
            DOCKER_USERNAME=${DOCKER_USERNAME}
            DOMAIN=${DOMAIN}
            CERT_RESOLVER=${CERT_RESOLVER}
            PROXY_NETWORK=${PROXY_NETWORK}
            EOF

            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            PROXY_CHOICE="${PROXY_TYPE:-traefik}"
            OVERLAY_FILE="reverse-proxy/docker-compose.${PROXY_CHOICE}.yml"

            if [ ! -f "$OVERLAY_FILE" ]; then
              echo "Varning: Hittade inte overlay-filen $OVERLAY_FILE, faller tillbaka på traefik."
              OVERLAY_FILE="reverse-proxy/docker-compose.traefik.yml"
            fi

            echo "Startar stack med: compose.prod.yml + $OVERLAY_FILE"

            docker compose -f compose.prod.yml -f "$OVERLAY_FILE" pull
            docker compose -f compose.prod.yml -f "$OVERLAY_FILE" up -d --force-recreate --remove-orphans
            docker image prune -f
