name: CI/CD Pipeline

on:
    push:
        branches: ["deploy"]
    pull_request:
        branches: ["main"]

jobs:
    # ---------------------------------------------------------------------------
    # 1. TEST OCH KVALITETSKONTROLL (CI)
    # ---------------------------------------------------------------------------

    test-backend:
        name: Test Backend (FastAPI)
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r backend/requirements.txt
                  pip install pytest httpx

            - name: Run Pytest
              env:
                  PYTHONPATH: backend
              run: |
                  pytest backend/tests || echo "Inga tester hittades ännu"

    test-frontend:
        name: Lint & Build Frontend
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run linter (oxlint)
              working-directory: ./frontend
              run: npm run lint

            - name: Type check and build
              working-directory: ./frontend
              run: npm run build
