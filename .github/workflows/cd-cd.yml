name: CI/CD Pipeline

on:
  push:
    branches: ["deploy"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST OCH KVALITETSKONTROLL (CI)
  # ---------------------------------------------------------------------------

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests || echo "Inga tester hittades ännu"

  test-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check and build
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: Build & Push Images to Docker Hub
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # Krävs för att dra ned faktiska modellfiler och inte bara the pointers

      # Generera en snygg tidsstämpel (ÅÅÅÅMMDD-TTMM) och kort SHA
      - name: Generate timestamp and short sha
        id: meta
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Hämta docker hub inloggningnarna från hashicorp Vault
      - name: Import Secrwets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      # Logga in mot Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{env.DOCKER_USERNAME}}
          password: ${{env.DOCKER_PASSWORD}}

      # Kofigurera Docker Buildx för snabbare byggen och lager-caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bygga och pusha backend
      - name: Build & Push backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-backend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
          cache-from: type=sha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Hämta hemligheter från Vault
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD ;
            kv/data/predictor ENTSOE_API_KEY | ENTSOE_API_KEY

      # 2. Skapa målmappen på servern om den saknas
      - name: Prepare directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          script: |
            mkdir -p /home/repos/predictor/backend

      # 3. Kopiera compose-filen till VPS:en (precis som i Showtime)
      - name: Copy docker-compose files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: "/home/repos/predictor"

      # 4. Skriv .env och starta containrarna
      - name: Execute Deploy Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,ENTSOE_API_KEY
          script: |
            cd /home/repos/predictor

            # Skapa .env i backend-mappen
            echo "ENTSOE_API_KEY=${ENTSOE_API_KEY}" > backend/.env
            echo "FASTAPI_ENV=production" >> backend/.env
            echo "PYTHONPATH=/app" >> backend/.env

            # Exportera DOCKER_USERNAME för compose-filen
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}" > .env

            # Logga in mot Docker Hub
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Dra hem nya images och starta om
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
              # 4. Rensa gamla oanvända images
            docker image prune -f
            echo "Deploy slutförd framgångsrikt!"
