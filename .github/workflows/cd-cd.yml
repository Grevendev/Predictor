name: CI/CD Pipeline

on:
  push:
    branches: ["deploy"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST OCH KVALITETSKONTROLL (CI)
  # ---------------------------------------------------------------------------

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests || echo "Inga tester hittades ännu"

  test-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check and build
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: Build & Push Images to Docker Hub
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # Krävs för att dra ned faktiska modellfiler och inte bara the pointers

      # Generera en snygg tidsstämpel (ÅÅÅÅMMDD-TTMM) och kort SHA
      - name: Generate timestamp and short sha
        id: meta
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Hämta docker hub inloggningnarna från hashicorp Vault
      - name: Import Secrwets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      # Logga in mot Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{env.DOCKER_USERNAME}}
          password: ${{env.DOCKER_PASSWORD}}

      # Kofigurera Docker Buildx för snabbare byggen och lager-caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bygga och pusha backend
      - name: Build & Push backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-backend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-backend:${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:latest
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
            ${{ env.DOCKER_USERNAME }}/predictor-frontend:${{ steps.meta.outputs.TIMESTAMP }}
          cache-from: type=sha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: ci-cd
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy'
    steps:
      # 1. Hämta alla hemligheter (både server-uppgifter och applikationsnycklar) från Vault
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SSH_PRIVATE_KEY ;
            kv/data/predictor ENTSOE_API_KEY | ENTSOE_API_KEY

      # 2. Klona/uppdatera, skapa .env och starta containrar via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: "https://github.com/${{ github.repository }}.git"
          ENTSOE_API_KEY: ${{ env.ENTSOE_API_KEY }}
          TARGET_DIR: "/home/repos/predictor"
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          envs: REPO_URL,ENTSOE_API_KEY,TARGET_DIR
          script: |
            set -e

            # 1. Kontrollera om projektmappen redan finns
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Mappen $TARGET_DIR finns inte. Genomför initial kloning..."
              mkdir -p "$(dirname "$TARGET_DIR")"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
              git lfs install
              git lfs pull
            else
              echo "Projektet finns redan. Hämtar senaste ändringarna..."
              cd "$TARGET_DIR"
              git fetch --all
              git reset --hard origin/main
              git lfs pull
            fi

            # 2. Skapa / uppdatera backend/.env säkert
            echo "Konfigurerar backend/.env..."
            mkdir -p backend
            cat <<EOF > backend/.env
            ENTSOE_API_KEY=${ENTSOE_API_KEY}
            FASTAPI_ENV=production
            PYTHONPATH=/app
            EOF
            chmod 600 backend/.env

            # 3. Dra nya images från Docker Hub och starta om tjänsterna
            echo "Driftsätter med Docker Compose..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Rensa gamla oanvända images
            docker image prune -f
            echo "Deploy slutförd framgångsrikt!"
